# Webserver für die Kinder-Plattform.
#
# Die Seite ist rein statisch — es gibt nichts zu rechnen, nichts zu
# speichern und keine Datenbank. Deshalb reicht ein nginx, der Dateien
# ausliefert, und der Container braucht kein einziges beschreibbares
# Verzeichnis (siehe read_only in docker-compose.yml).
#
# Zwei Dinge sind hier wichtig:
#  * Port 8080 — Port 8000 gehört auf dem Jetson dem ein anderer Dienst.
#  * Alle Schreibpfade liegen unter /tmp, das als tmpfs eingehängt wird.
#    Sonst startet nginx bei read-only Dateisystem nicht.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # nginx will diese Verzeichnisse anlegen können — ab in den tmpfs damit.
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  # Nur das Nötigste ins Log: der Jetson soll seine SD-Karte nicht
  # mit Zugriffszeilen füllen.
  access_log off;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;
  keepalive_timeout 30;

  gzip              on;
  gzip_min_length   1024;
  gzip_comp_level   5;
  gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    charset utf-8;
    charset_types text/css application/javascript text/plain;

    # Für den Healthcheck von docker compose und zum Nachschauen von Hand.
    location = /gesund {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Hinweis: immer nur EINE Art, Cache-Control zu setzen — `expires`
    # und `add_header Cache-Control` zusammen ergeben zwei widersprüchliche
    # Header in der Antwort.

    # three.js ist 700 KB groß und ändert sich praktisch nie.
    # Einmal laden, dann einen Monat aus dem Browser-Cache.
    location /spiele/nicecraft/lib/ {
      add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Die drei Sprite-Bilder ändern sich auch selten.
    location ~* \.(png|jpe?g|gif|svg|ico|woff2?)$ {
      add_header Cache-Control "public, max-age=604800";
    }

    # HTML, CSS und JavaScript immer kurz nachfragen. Damit sehen die
    # Kinder nach einem neuen Deploy sofort die neue Fassung und müssen
    # nicht hart neu laden.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ =404;
    }
  }
}

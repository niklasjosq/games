# Kinder-Plattform — Normalbetrieb auf dem Jetson Nano.
#
# ═══════════════════════════════════════════════════════════════════════
# GUTER NACHBAR: Auf dem Jetson können weitere Dienste laufen.
# Deshalb hat diese Anwendung durchgängig eigene Namen —
#
#   Image spieleplattform:latest · Container "spiele"
#   Compose-Projekt "spieleplattform" (siehe `name:` unten)
#   Verzeichnis ~/spieleplattform · Port 8080
#
# — und teilt sich mit nichts anderem ein Netzwerk, ein Volume oder eine
# Datei. Ein `docker compose down` in diesem Verzeichnis betrifft immer
# nur diese Anwendung.
#
# Port 8080 statt 8000 oder 80: 80 bräuchte root, und 8000 ist auf
# Bastelrechnern oft schon vergeben.
# ═══════════════════════════════════════════════════════════════════════
#
# Zum Netzwerkmodus: `network_mode: host`, weil Docker für ein
# Bridge-Netzwerk iptables-Regeln in die Tabelle "raw" schreibt, die der
# 4.9er-Tegra-Kernel des Jetson nicht kennt ("can't initialize iptables
# table 'raw'"). Wer einen Kernel mit iptable_raw hat und die stärkere
# Netz-Isolation möchte, nimmt docker-compose.bridge.yml.
#
# Die Abschottung dieses Containers kommt ohnehin nicht aus dem Netzwerk,
# sondern daraus, dass er praktisch nichts kann: read-only, keine
# Sonderrechte, keine Volumes, kein Zugriff auf Daten des Hosts.

name: spieleplattform

services:
  spiele:
    image: spieleplattform:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spiele
    restart: unless-stopped

    # Kein `ports:` — im host-Netzwerk lauscht nginx direkt auf Port 8080
    # des Jetson. Erreichbar im Heimnetz, nicht von außen (der Router
    # gibt nichts nach draußen frei).
    network_mode: host

    # ---- Abschottung -------------------------------------------------
    # Die Seite ist statisch, es wird nichts gespeichert (alle Punkte und
    # Noten liegen im Browser der Kinder). Deshalb kann der Container
    # komplett schreibgeschützt laufen.
    read_only: true
    tmpfs:
      # Hier legt nginx seine PID-Datei und Temp-Verzeichnisse ab.
      # Im RAM, klein begrenzt, beim Neustart weg.
      - /tmp:size=16m,mode=1777

    # Läuft als nginx-Benutzer, nicht als root (steht auch im Dockerfile;
    # hier noch einmal, damit es beim Lesen der Compose-Datei sichtbar ist).
    user: '101:101'

    cap_drop:
      - ALL
    security_opt:
      # Kein setuid-Trick kann Rechte hinzugewinnen.
      - no-new-privileges:true

    # Keine Volumes. Der Container sieht vom Jetson nichts außer sich selbst.

    environment:
      TZ: 'Europe/Berlin'

    # nginx mit einem Worker für statische Dateien braucht ~15 MB.
    # Das knappe Limit ist Absicht: der Jetson hat 4 GB und teilt sie mit
    # anderen Diensten — die Spiele sollen dort nie im Weg stehen.
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64

    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/gesund']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
